services:
  jupyter:
    # Plain runtime base image — the SDK is installed from bind-mounted source, not baked in.
    image: python:3.12-slim
    working_dir: /app/python
    volumes:
      # Bind-mount the cloned source so edits are reflected live.
      - .:/app
    ports:
      - "3000:3000"
    environment:
      # Model IDs the SK OpenAI connector reads via pydantic-settings.
      - OPENAI_CHAT_MODEL_ID=gpt-4o
      - OPENAI_EMBEDDING_MODEL_ID=text-embedding-3-small
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      # Placeholders first (app boots without credentials)…
      - ./.env.base44-defaults
      # …platform secrets last — always wins.
      - /run/base44/app.env
    command: >
      bash -c '
      set -e
      pip install --quiet uv
      uv sync --extra notebooks --prerelease=if-necessary-or-explicit
      uv pip install jupyterlab
      uv run python -m ipykernel install --user --name semantic-kernel --display-name "Semantic Kernel (Python 3.12)"
      exec uv run jupyter lab
        --ip=0.0.0.0
        --port=3000
        --no-browser
        --ServerApp.token=""
        --ServerApp.password=""
        --ServerApp.allow_origin="*"
        --ServerApp.allow_remote_access=True
        --ServerApp.tornado_settings="{\"headers\":{\"X-Frame-Options\":\"ALLOWALL\",\"Content-Security-Policy\":\"frame-ancestors *;\"}}"
        --notebook-dir=/app/python/samples
      '
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/lab', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
